[package]
name = "bloch-stellar-vault"
description = "PROTOTYPE, UNAUDITED. Committee-attested source vault on Stellar for the Bloch L2 bridge (bUSDC.xlm)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "hazmat-address"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
sha2 = "0.10"
