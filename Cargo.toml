# bloch-l2-bridge — SCAFFOLD, UNAUDITED, not a working L2.
#
# L1<->L2 bridge TYPES for the (design-only) Bloch EVM L2, per
# docs/specs/BLOCH-L2-EVM-DESIGN.md §5:
#   * L2D0 deposit envelope codec (byte-exact, strict decode, typed errors)
#   * ATOM_SCALE sats->wei conversion with exactness invariants
#   * withdrawal message leaf + keccak256 depth-32 incremental Merkle tree
#     (Ethereum-deposit-contract construction) + inclusion-proof verify
#   * DepositEvent / WithdrawalStatus type set + K(amount) depth schedule
#   * WBLCH / L2BlochBridge / Uniswap-v2 deploy HARNESS CONFIG (config +
#     validation, plus compile-and-hash of the pinned sources when a solc
#     0.8.24 is present — no deployment, no chain interaction)
#
# HONESTY (non-negotiable, mirrored in the crate docs): the v1 L1 vault is
# CUSTODY, full stop — nothing here moves value. Bloch today is k=4,
# low-hashrate, 51%-attackable, unaudited; no finite confirmation depth is
# finality. This crate is types + math only.
#
# Standalone-workspace pattern (same as crates/bloch-tokens): its own empty
# [workspace] table so it builds and tests outside the frozen root members
# list and can carry its deps independently.
[package]
name = "bloch-l2-bridge"
version = "0.0.0-scaffold"
edition = "2021"
# Minimum supported Rust: `u128::is_multiple_of` / `let … else` / `div_ceil`.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "DESIGN SCAFFOLD — unaudited, not a working L2, nothing here moves value. L1<->L2 bridge types for the Bloch EVM L2 design: L2D0 deposit envelope codec, keccak256 depth-32 incremental withdrawal Merkle tree + proof verify, ATOM_SCALE conversion, confirmation-depth schedule, and a WBLCH/Uniswap-v2 deploy harness CONFIG (no deploys, no chain interaction). The v1 L1 vault is CUSTODY, full stop."

# Deliberately empty: this crate is its own workspace root (re-homeable,
# excluded from the product root workspace).
[workspace]

[features]
# The optional offline Ethereum inclusion verifier is qualified with Rust 1.94.1.
# Keep the existing default bridge build and its 1.87 MSRV independent.
ethereum-inclusion = ["dep:alloy-primitives", "dep:alloy-rlp", "dep:alloy-trie", "dep:k256"]

[[bin]]
name = "ethereum_deployment_inclusion_verifier"
path = "src/bin/ethereum_deployment_inclusion_verifier.rs"
required-features = ["ethereum-inclusion"]

[[test]]
name = "ethereum_deployment_inclusion"
path = "tests/ethereum_deployment_inclusion.rs"
required-features = ["ethereum-inclusion"]

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak", "kmac"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
sha2 = "0.10"
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std"], optional = true }
alloy-rlp = { version = "=0.3.16", default-features = false, features = ["std"], optional = true }
alloy-trie = { version = "=0.9.5", default-features = false, features = ["std"], optional = true }
k256 = { version = "=0.13.4", default-features = false, features = ["std", "ecdsa"], optional = true }

[dev-dependencies]
rcgen = "0.13"
