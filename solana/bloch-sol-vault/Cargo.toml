# Bloch bridge vault for Solana (bUSDC.sol). UNAUDITED. Not for deployment.
# Native Rust on the solana-program crate, no framework: see docs/SOLANA-VAULT.md, "Why native Rust".
# Toolchain pins (docs/SOLANA-VAULT.md section 9): Agave v4.4.1 (cargo-build-sbf 4.5.0, platform-tools v1.57),
# Rust 1.95.0 on the host. Build with `cargo build-sbf --locked`.
[package]
name = "bloch-sol-vault"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "UNAUDITED. Source-side vault of the Bloch L2 bridge on Solana: classic SPL token custody released on a threshold of secp256k1 committee signatures."

# Its own workspace root: built and locked apart from the repository's root crate.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = { version = "=5.2.0", default-features = false }
solana-keccak-hasher = { version = "=3.1.0", features = ["sha3"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[features]
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
